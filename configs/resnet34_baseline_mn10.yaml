# ResNet-34 baseline (no HSDC block) on ModelNet10 — 3DGS radiance field ERP
# Ablation baseline for HSDCNet: standard convolutions in place of HSDC blocks.
# Trained from scratch; the accuracy gap vs resnet34_hsdc_mn10 isolates the
# contribution of the HSDC distortion-correction block.
# Input: N_SHELLS-channel radiance field ERP from ModelSplat PLY files

run_name: resnet34_baseline_mn10_seed42
seed: 42

data:
  dataset: modelnet10
  data_root: gs_data/modelsplat/modelsplat_ply
  cache_dir: data/processed/modelnet10/radiance_field
  pipeline: radiance_field          # EgoNeRF exponential shell ERP from 3DGS
  n_shells: 8
  erp_width: 512
  erp_height: 256
  r_near_pct: 5.0
  r_far_pct: 95.0
  add_color_erp: false
  n_steps_per_shell: 4              # ray-march steps within each shell's radial extent
  cutoff_sigma: 3.0
  num_workers: 4
  batch_size: 32
  train_val_split: 0.8
  stratified_split: true               # class-stratified train/val split (matches per-class proportions)
  augment_prob: 0.3                  # per-primitive augmentation probability
  log1p_transform: true              # compress [0,~14] → [0,~2.7]
  derived_channels:
    - pseudo_depth
    - mip

model:
  backbone: resnet34
  block: none                        # plain ResNet-34 — no distortion-correction block
  num_classes: 10
  in_channels: 10                    # 8 density shells + pseudo_depth + mip
  erp_width: 512
  erp_height: 256
  dropout: 0.3                       # dropout before final FC

training:
  max_epochs: 500                    # match resnet34_hsdc_mn10 for fair comparison
  optimizer: adamw
  lr: 1.0e-4
  weight_decay: 5.0e-4
  lr_scheduler: cosine
  lr_min: 1.0e-6
  lr_warmup_epochs: 10
  early_stopping_patience: 100
  gradient_clip_norm: 1.0
  mixed_precision: true
  label_smoothing: 0.1
  class_weighted_loss: true
  use_mix_augmentation: true          # MixUp + CutMix (match HSDC config)
  mixup_alpha: 0.4
  cutmix_alpha: 0.4                  # CutMix — alternates 50/50 with MixUp per batch

output:
  experiments_dir: experiments
  save_every_n_epochs: 50
