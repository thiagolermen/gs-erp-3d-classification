# Vision Transformer (ViT-Tiny) on ModelNet40 — 3DGS radiance field ERP
# Transformer baseline for RF-3DGS. Reference target (geometric ERP):
#   PanoFormer ViT (from scratch) = 79.7% top-1 (CLAUDE.md reference table).
# Input: identical 10-channel radiance field ERP used by the HSDC/SWHDC CNNs,
#        so any accuracy gap isolates the distortion-correction blocks.

run_name: vit_mn40_seed42
seed: 42

data:
  dataset: modelnet40
  data_root: gs_data/modelsplat/modelsplat_ply
  cache_dir: data/processed/modelnet40/radiance_field
  pipeline: radiance_field          # EgoNeRF exponential shell ERP from 3DGS
  n_shells: 8
  erp_width: 512
  erp_height: 256
  r_near_pct: 5.0
  r_far_pct: 95.0
  add_color_erp: false
  n_steps_per_shell: 4              # ray-march steps within each shell's radial extent
  cutoff_sigma: 3.0                  # spatial culling threshold (in sigmas)
  num_workers: 4
  batch_size: 32
  train_val_split: 0.8
  stratified_split: true               # class-stratified train/val split (matches per-class proportions)
  augment_prob: 0.3                  # per-primitive augmentation probability
  log1p_transform: true              # compress [0,~14] → [0,~2.7]; amplifies low-density boundaries
  derived_channels:                  # appended after log1p, before augmentation
    - pseudo_depth                   # density-weighted avg shell index per pixel
    - mip                            # max intensity projection across shells

model:
  backbone: vit
  block: none                        # ViT has no distortion-correction block
  num_classes: 40
  in_channels: 10                    # 8 density shells + pseudo_depth + mip
  erp_width: 512
  erp_height: 256
  patch_size: 16                     # 256/16 × 512/16 = 16 × 32 = 512 tokens
  embed_dim: 192                     # ViT-Tiny (≈ 5.5 M params, matches HSDCNet's 5.3 M)
  depth: 12
  num_heads: 3
  mlp_ratio: 4.0
  dropout: 0.1                       # embedding / MLP / head dropout
  attn_dropout: 0.0
  drop_path_rate: 0.1                # stochastic depth, scaled 0→0.1 over depth

training:
  max_epochs: 500
  optimizer: adamw                   # decoupled weight decay
  lr: 1.0e-4
  weight_decay: 0.05                 # ViTs need stronger decay than the CNN 5e-4
  lr_scheduler: cosine
  lr_min: 1.0e-6
  lr_warmup_epochs: 10               # linear warmup from 10% to 100% of base LR
  early_stopping_patience: 100
  gradient_clip_norm: 1.0
  mixed_precision: true
  label_smoothing: 0.1
  class_weighted_loss: true          # up-weight minority classes
  use_mix_augmentation: true          # MixUp + CutMix — especially important for from-scratch ViTs
  mixup_alpha: 0.4
  cutmix_alpha: 0.4                  # CutMix — alternates 50/50 with MixUp per batch

output:
  experiments_dir: experiments
  save_every_n_epochs: 50
